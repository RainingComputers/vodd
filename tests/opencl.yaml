      pocl:
        consistency_il_programs: "PoCL advertises IL support inconsistently"
        get_context_info_mult_devices: "requires more than one device; PoCL exposes a single cpu device"
        negative_create_context: "PoCL does not return CL_INVALID_PROPERTY for an invalid property value"
        negative_create_context_from_type: "PoCL does not return CL_INVALID_PROPERTY for an invalid property value"
        negative_create_sub_devices: "PoCL returns the wrong error code for invalid partition properties"
        negative_get_device_ids: "PoCL returns the wrong error code for an invalid device type"
        negative_invalid_arg_sampler: "PoCL returns the wrong error code for an invalid sampler argument"
        negative_set_kernel_arg_invalid_image: "PoCL returns the wrong error code for an invalid image argument"
        negative_set_read_write_image_arg: "PoCL returns the wrong error code for a read-write image argument"
        null_required_work_group_size: "PoCL mishandles a null required work group size"
