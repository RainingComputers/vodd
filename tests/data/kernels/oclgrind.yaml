  - name: restrict
    origin: bugs/restrict
    entry: reduce
    global_size: [64, 1, 1]
    local_size: [4, 1, 1]
    arguments:
      - { value: [256], elem: uint }
      - { buffer: 1024, range: [0, 1, 255] }
      - { buffer: 64 }
      - { local: 16 }
    expected: {}
    oclgrind_errors: 0
    source: |
      kernel void reduce(uint n,
                         global uint * restrict data,
                         global uint * restrict result,
                         local uint * restrict localData)
      {
        uint gid = get_global_id(0);
        uint lid = get_local_id(0);
        uint gsz = get_global_size(0);
        uint lsz = get_local_size(0);
        uint grp = get_group_id(0);
      
        uint sum = 0;
        for (uint i = gid; i < n; i+=gsz)
        {
          sum += data[i];
        }
      
        localData[lid] = sum;
        for (uint offset = lsz/2; offset > 0; offset/=2)
        {
          barrier(CLK_LOCAL_MEM_FENCE);
          if (lid < offset)
          {
            localData[lid] += localData[lid + offset];
          }
        }
      
        if (lid == 0)
        {
          result[grp] = localData[lid];
        }
      }

  - name: write_vector_write_only_fp
    origin: bugs/write_vector_write_only_fp
    skip: "DIVERGENCE: at -O0 the SPIR-V translator lowers a partial vector store as
      OpLoad + OpCompositeInsert + OpStore, so vodd sees a genuine read of a write-only
      buffer and reports 4 access_flags. Oclgrind interprets LLVM IR, one step earlier,
      where clang emits a scalar element store with no load. Passes at -O2, where the
      translator elides the load. Not a detector defect - suppressing it needs dataflow
      to prove the loaded value is written back unchanged. Measured blast radius: only
      partial vector stores are affected (scalar, char, full-vector and struct-field
      stores to a write-only buffer are all silent), and the phantom load also inflates
      mapped_region counts and can manufacture data_race on benign uniform partial
      vector writes"
    entry: write_vector_write_only_fp
    global_size: [4, 1, 1]
    local_size: [1, 1, 1]
    arguments:
      - { buffer: 64, access: wo, fill: 7 }
    expected: {}
    oclgrind_errors: 0
    source: |
      kernel void write_vector_write_only_fp(global int4 *output)
      {
        int i = get_global_id(0);
        output[i].x = 42;
      }

