[package]
name = "vodd"
version = "0.1.0"
edition = "2024"
authors = ["RainingComputers <vishnu.vish.shankar@gmail.com>"]


[lib]
crate-type = ["cdylib", "rlib"]

[dev-dependencies]
yaml-rust2 = "0.10"

[dependencies]
maud = "0.27"
rayon = "1.12.0"
syntect = { version = "5.3.0", default-features = false, features = ["html", "regex-fancy", "default-syntaxes"] }
tiny_http = "0.12.0"
