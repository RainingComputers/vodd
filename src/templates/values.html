<figure class="widget" {% if id %}id="{{ id }}"{% endif %}>
    <figcaption>
        <span class="what"> Values </span>
        <span class="note mono"> {{ scope }} </span>
    </figcaption>
    {%- if values %}
        <ul class="vars">
            {%- for row in values %}
                <li class="across base">
                    <span class="name mono clip" title="declared at {{ row.at }}">
                        {{ row.name }}
                    </span>
                    <span class="grew mono clip {{ row.tone }}" title="{{ row.shown }}">
                        {{ row.shown }}
                    </span>
                    <span class="type mono clip"> {{ row.type_name }} </span>
                    <span class="pill mono {{ row.kind }}"> {{ row.kind }} </span>
                </li>
            {%- endfor %}
        </ul>
    {%- else %}
        <p class="empty">Nothing in scope here.</p>
    {%- endif %}
</figure>
