<figure class="widget" {% if id %}id="{{ id }}"{% endif %}>
    <figcaption>
        <span class="what"> Details </span>
    </figcaption>
    {%- if rows %}
        <dl class="kv">
            {%- for row in rows %}
                <dt>{{ row.label }}</dt>
                <dd class="mono">{{ row.value }}</dd>
            {%- endfor %}
        </dl>
    {%- else %}
        <p class="empty">No details for this one.</p>
    {%- endif %}
</figure>
