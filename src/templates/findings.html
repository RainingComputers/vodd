<figure class="widget" {% if id %}id="{{ id }}"{% endif %}>
    <figcaption>
        <span class="what"> Diagnostics </span>
    </figcaption>
    {%- if findings %}
        <ul class="findings">
            {%- for row in findings %}
                <li
                    class="{{ row.severity }}"
                    aria-current="{{ row.selected | flag }}"
                    data-pick="{{ row.pick }}"
                >
                    <div class="top across base">
                        <b class="clip" title="{{ row.headline }}"> {{ row.headline }} </b>
                        <span class="site mono"> {{ row.at }} </span>
                    </div>
                    {%- if row.selected %}
                        <span class="detail"> {{ row.detail }} </span>
                    {%- endif %}
                </li>
            {%- endfor %}
        </ul>
    {%- else %}
        <p class="empty">No problems found.</p>
    {%- endif %}
</figure>
