<figure class="widget" {% if id %}id="{{ id }}"{% endif %}>
    <figcaption>
        <span class="what"> Execution paths </span>
        <span class="note mono"> {{ note }} </span>
    </figcaption>
    <div class="body">
        <div class="bar">
            {%- for track in tracks %}
                <span style="background: {{ track.colour }}; width: {{ track.share }}"></span>
            {%- endfor %}
        </div>
        <ul class="tracks">
            {%- for track in tracks %}
                <li
                    class="across"
                    aria-current="{{ track.current | flag }}"
                    data-pick="{{ track.pick }}"
                >
                    <span class="chip" style="background: {{ track.colour }}"></span>
                    <b> {{ track.name }} </b>
                    <span class="grew mono clip" title="{{ track.tip }}"> {{ track.label }} </span>
                    <span class="tally mono"> {{ track.items }} </span>
                </li>
            {%- endfor %}
        </ul>
    </div>
</figure>
